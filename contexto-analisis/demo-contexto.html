<!doctype html>
<!--
  Ruta: contexto-analisis/demo-contexto.html
  Demostración AISLADA de la cajetilla «Contexto del análisis» y del bloque que añade al prompt.

  sirve para probar el componente antes de integrarlo.

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; font-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">

  <link rel="icon" href="data:,">

</head>
<body>
  <div class="pantalla-carga" role="status">Cargando…</div>

      <div class="container py-3">

        <p class="subtitulo-app">Demostración aislada del campo y del bloque que se añade al prompt fiscal</p>
      </div>
    </header>
    <main class="container contenido">
      <section class="card tarjeta" aria-labelledby="tituloGenerador">

          <div id="contenedorContexto"></div>
          <button type="button" class="btn btn-primary" id="botonGenerar">Generar prompt de ejemplo</button>
          <div class="mt-3" id="avisosContexto" aria-live="polite"></div>
          <label for="promptGenerado" class="form-label fw-semibold mt-3">Prompt generado</label>
          <textarea class="form-control resultado-texto" id="promptGenerado" rows="18" readonly></textarea>
          <ul class="lista-diagnostico" id="verificacionPrompt" aria-live="polite"></ul>
